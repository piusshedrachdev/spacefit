<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Checkout - SpaceFit</title>
  <!-- Tailwind CSS v3 with Forms Plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Tailwind Custom Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style data-purpose="custom-styling">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>

<body
  class="bg-[#F8FAFC] text-slate-800 min-h-screen flex flex-col antialiased selection:bg-brand-100 selection:text-brand-900">
  <!-- BEGIN: MainHeader -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs" data-purpose="navigation-header">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <!-- Brand Logo & Main Nav Links -->
      <div class="flex items-center gap-8">
        <!-- Logo -->
        <a class="flex items-center gap-2 text-brand-900 font-bold text-xl tracking-tight" data-purpose="site-brand"
          href="#">
          <svg class="w-6 h-6 text-brand-700" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L2 9.5V20C2 20.5523 2.44772 21 3 21H9V14H15V21H21C21.5523 21 22 20.5523 22 20V9.5L12 2Z">
            </path>
            <path d="M9 10C9 8.34315 10.3431 7 12 7C13.6569 7 15 8.34315 15 10V11H9V10Z" fill="#34D399"></path>
          </svg>
          <span class="">SpaceFit</span>
        </a>
        <!-- Desktop Navigation Items -->
        <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-600">
          <a class="hover:text-brand-800 transition-colors" href="#">Shop</a>
          <a class="hover:text-brand-800 transition-colors" href="#">Categories</a>
        </nav>
      </div>
      <!-- Center Search Bar -->
      <div class="flex-1 max-w-md mx-2 sm:mx-6" data-purpose="header-search">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"
                stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <input
            class="w-full pl-9 pr-4 py-1.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-full focus:outline-none focus:ring-2 focus:ring-brand-700 focus:bg-white text-slate-700 placeholder-slate-400 transition-all shadow-inner"
            placeholder="Search for furniture, rooms..." type="text">
        </div>
      </div>
      <!-- User Action Icons -->
      <div class="flex items-center space-x-3 text-slate-600" data-purpose="user-actions">
        <!-- Shopping Cart Icon -->
        <button aria-label="Shopping Cart" class="p-2 hover:bg-slate-100 rounded-full text-slate-700 transition"
          type="button">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"
              stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <!-- Profile Icon -->
        <button aria-label="User Account" class="p-2 hover:bg-slate-100 rounded-full text-slate-700 transition"
          type="button">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path
              d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
              stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <!-- END: MainHeader -->
  <!-- BEGIN: MainContent -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8" data-purpose="checkout-container">
    <!-- Page Title -->
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 mb-6" data-purpose="page-title">
      Checkout
    </h1>
    <!-- Checkout Grid Layout: 2 Columns on Desktop -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <!-- LEFT COLUMN: Customer & Delivery Details (7 Cols) -->
      <div class="lg:col-span-7 flex flex-col gap-6" data-purpose="left-forms-column">
        <!-- BEGIN: Section 1 - Customer Information -->
        <section class="bg-white rounded-xl border border-slate-200/90 shadow-xs p-5 sm:p-6"
          data-purpose="customer-info-section">
          <h2 class="text-base font-semibold text-slate-900 mb-4 flex items-center">
            1. Customer Information
          </h2>
          <div class="space-y-4">
            <!-- Full Name -->
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1 flex items-center gap-1" for="fullName">
                Full name
                <svg class="w-3.5 h-3.5 text-slate-400 cursor-pointer hover:text-slate-600" fill="none"
                  stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                    stroke-linejoin="round" stroke-width="2"></path>
                </svg>
              </label>
              <input
                class="w-full text-sm border-slate-200 rounded-lg px-3.5 py-2.5 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 bg-white text-slate-800 shadow-xs placeholder-slate-400"
                id="fullName" name="fullName" type="text" value="John Doe">
            </div>
            <!-- Email Address -->
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1" for="email">
                Email address
              </label>
              <input
                class="w-full text-sm border-slate-200 rounded-lg px-3.5 py-2.5 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 bg-white text-slate-800 shadow-xs placeholder-slate-400"
                id="email" name="email" type="email" value="john@example.com">
            </div>
            <!-- Phone Number -->
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1" for="phone">
                Phone number
              </label>
              <input
                class="w-full text-sm border-slate-200 rounded-lg px-3.5 py-2.5 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 bg-white text-slate-800 shadow-xs placeholder-slate-400"
                id="phone" name="phone" type="tel" value="+234 801 234 5678">
            </div>
          </div>
        </section>
        <!-- END: Section 1 - Customer Information -->
        <!-- BEGIN: Section 2 - Delivery Information -->
        <section class="bg-white rounded-xl border border-slate-200/90 shadow-xs p-5 sm:p-6"
          data-purpose="delivery-info-section">
          <h2 class="text-base font-semibold text-slate-900 mb-4">
            2. Delivery Information
          </h2>
          <div class="space-y-4">
            <!-- Street Address -->
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1" for="address">
                Address
              </label>
              <input
                class="w-full text-sm border-slate-200 rounded-lg px-3.5 py-2.5 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 bg-white text-slate-800 shadow-xs placeholder-slate-400"
                id="address" name="address" type="text" value="123 Example Street">
            </div>
            <!-- City and State Two-Column Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <!-- City Dropdown -->
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1 flex items-center gap-1" for="city">
                  City
                  <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                  </svg>
                </label>
                <select
                  class="w-full text-sm border-slate-200 rounded-lg px-3.5 py-2.5 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 bg-white text-slate-800 shadow-xs"
                  id="city" name="city">
                  <option selected="" value="Lagos">Lagos</option>
                  <option value="Abuja">Abuja</option>
                  <option value="Ibadan">Ibadan</option>
                </select>
              </div>
              <!-- State Dropdown -->
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1" for="state">
                  State
                </label>
                <select
                  class="w-full text-sm border-slate-200 rounded-lg px-3.5 py-2.5 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 bg-white text-slate-800 shadow-xs"
                  id="state" name="state">
                  <option selected="" value="Lagos">Lagos</option>
                  <option value="FCT">Federal Capital Territory</option>
                  <option value="Oyo">Oyo</option>
                </select>
              </div>
            </div>
            <!-- Delivery Instructions (Optional) -->
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1" for="instructions">
                Delivery instructions (optional)
              </label>
              <textarea
                class="w-full text-sm border-slate-200 rounded-lg px-3.5 py-2.5 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 bg-white text-slate-800 shadow-xs placeholder-slate-400 resize-y"
                id="instructions" name="instructions" placeholder="E.g. Ring the bell" rows="3"></textarea>
            </div>
          </div>
        </section>
        <!-- END: Section 2 - Delivery Information -->
      </div>
      <!-- END: Left Column -->
      <!-- RIGHT COLUMN: Order Summary & Payment (5 Cols) -->
      <div class="lg:col-span-5 flex flex-col gap-6" data-purpose="right-summary-column">
        <!-- BEGIN: Order Summary Section -->
        <section class="bg-white rounded-xl border border-slate-200/90 shadow-xs p-5 sm:p-6"
          data-purpose="order-summary-card">
          <h2 class="text-base font-semibold text-slate-900 mb-5">
            Order Summary
          </h2>
          <!-- Products List -->
          <div class="divide-y divide-slate-100 mb-5">
            <!-- Item 1: Luna Bed -->
            <div class="py-3.5 first:pt-0 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3 min-w-0">
                <img alt="Luna Bed" class="w-16 h-16 rounded-lg object-cover border border-slate-200 flex-shrink-0"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuAv2rHcY6xG_IySVreSWQMGFw67OxBdL9bdjjQCwjJcSlAwrv7s7mwgs5q8SHO19y_qHHJiFeGULX9vrMI7RBQv91TXGdZGy-a6rac-wbOW4JtJx56BoLWobJblCl9uxMr1julmK1OA0wLZynTfSEww9r1FAuopXtGV_PBAZ9P532el0oSrbA1k4EBBAwJNIeesFDTNLtcCm-Ijgn3RUguLTGXKHaT1B8zMz_ng2yXEULDshcGMZqVMDg">
                <div class="min-w-0">
                  <h3 class="text-sm font-semibold text-slate-800 truncate">Luna Bed</h3>
                  <p class="text-xs text-slate-500 mt-0.5">Qty: 1</p>
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <span class="text-sm font-semibold text-slate-900">₦480,000</span>
              </div>
            </div>
            <!-- Item 2: Comfort Mattress -->
            <div class="py-3.5 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3 min-w-0">
                <img alt="Comfort Mattress"
                  class="w-16 h-16 rounded-lg object-cover border border-slate-200 flex-shrink-0"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuD646tjCDPLN0QSK2wy-s7PRBcEQRSLE4aFn8HtXFQWvZk6BWGyIq29veX3FHMbdxfwEsgteOTnZZAsaCBTF2lgrd526T8eM4iM3hOwHiinUsCAU91CV5kIWTwXLSXwkx7CkXMj3rWwRFqz1WjN1Lfs3fT6usrmCI4wf-rB8HpiBcGaBGKL7Y-EsET_Ezx1iG0X7Ppa5lkQhjTRkUu2N71UzvS41wfU8O623YigK8PGjJ2w5XuR5PPyYg">
                <div class="min-w-0">
                  <div class="flex items-center gap-1">
                    <h3 class="text-sm font-semibold text-slate-800 truncate">Comfort Mattress</h3>
                    <svg class="w-3.5 h-3.5 text-slate-400 cursor-pointer flex-shrink-0" fill="none"
                      stroke="currentColor" viewBox="0 0 24 24">
                      <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                        stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                  </div>
                  <p class="text-xs text-slate-500 mt-0.5">Qty: 1</p>
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <span class="text-sm font-semibold text-slate-900">₦240,000</span>
              </div>
            </div>
            <!-- Item 3: Nexus Nightstand -->
            <div class="py-3.5 last:pb-0 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3 min-w-0">
                <img alt="Nexus Nightstand"
                  class="w-16 h-16 rounded-lg object-cover border border-slate-200 flex-shrink-0"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkahQ92yANEIMfbhDTh9-AjHdFriBQ9UlAzBj7o2BQ4VlPtgaPnzUeZZI9WOEdB-5JP4UWxETmBA7ePVuloEwzNawrIRv9UH_Zrc9HCm5hPBuj6Ou2NeyjSBsNmYG9N19sZdKPZTzU0GnUjzrKxJipBWH5ZDJuLZjoSSmxCjsJO3Vcd2WSJYgLMI-iJHI2rg9Qb3AMdvZmald6h_gD10yE4ru1XpcwKQYKKfDnHV97QroW1JHeMPIP4w">
                <div class="min-w-0">
                  <h3 class="text-sm font-semibold text-slate-800 truncate">Nexus Nightstand</h3>
                  <p class="text-xs text-slate-500 mt-0.5">Qty: 1</p>
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <span class="text-sm font-semibold text-slate-900">₦60,000</span>
              </div>
            </div>
          </div>
          <!-- Cost Breakdown Line Items -->
          <div class="space-y-2 pt-4 border-t border-slate-200/80 text-sm">
            <div class="flex justify-between text-slate-600">
              <span class="">Subtotal</span>
              <span class="font-medium text-slate-900">₦780,000</span>
            </div>
            <div class="flex justify-between text-slate-600 items-center">
              <span class="flex items-center gap-1">
                Delivery
                <svg class="w-3.5 h-3.5 text-slate-400 cursor-pointer" fill="none" stroke="currentColor"
                  viewBox="0 0 24 24">
                  <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                    stroke-linejoin="round" stroke-width="2"></path>
                </svg>
              </span>
              <span class="font-medium text-slate-900">₦0</span>
            </div>
            <!-- Grand Total -->
            <div class="flex justify-between items-center pt-2 text-base font-bold text-slate-900">
              <span class="">Total</span>
              <span class="">₦780,000</span>
            </div>
          </div>
        </section>
        <!-- END: Order Summary Section -->
        <!-- BEGIN: Payment Method Section -->
        <section class="bg-white rounded-xl border border-slate-200/90 shadow-xs p-5 sm:p-6"
          data-purpose="payment-method-card">
          <h2 class="text-base font-semibold text-slate-900 mb-4">
            Payment Method
          </h2>
          <div class="space-y-2.5" role="radiogroup">
            <!-- Option 1: Card (Selected) -->
            <label
              class="flex items-center justify-between border border-teal-600/60 bg-emerald-50/20 px-4 py-3 rounded-lg cursor-pointer transition">
              <div class="flex items-center gap-3">
                <input checked="" class="h-4 w-4 text-brand-800 focus:ring-brand-700 border-slate-300"
                  name="payment_method" type="radio" value="card">
                <span class="text-sm font-medium text-slate-800">Card (Visa, Mastercard)</span>
              </div>
            </label>
            <!-- Option 2: Bank Transfer -->
            <label
              class="flex items-center justify-between border border-slate-200 hover:border-slate-300 px-4 py-3 rounded-lg cursor-pointer transition">
              <div class="flex items-center gap-3">
                <input class="h-4 w-4 text-brand-800 focus:ring-brand-700 border-slate-300" name="payment_method"
                  type="radio" value="transfer">
                <span class="text-sm font-medium text-slate-700">Bank Transfer</span>
              </div>
            </label>
            <!-- Option 3: Cash on Delivery -->
            <label
              class="flex items-center justify-between border border-slate-200 hover:border-slate-300 px-4 py-3 rounded-lg cursor-pointer transition">
              <div class="flex items-center gap-3">
                <input class="h-4 w-4 text-brand-800 focus:ring-brand-700 border-slate-300" name="payment_method"
                  type="radio" value="cash">
                <span class="text-sm font-medium text-slate-700">Cash on Delivery</span>
              </div>
            </label>
          </div>
          <!-- Submit Button -->
          <div class="mt-6">
            <button
              class="w-full bg-brand-900 hover:bg-brand-950 text-white font-medium py-3 px-4 rounded-lg shadow-sm transition duration-150 ease-in-out text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-800"
              data-purpose="place-order-button" type="button">
              Place Order
            </button>
          </div>
        </section>
        <!-- END: Payment Method Section -->
      </div>
      <!-- END: Right Column -->
    </div>
  </main>
  <!-- END: MainContent -->
  <!-- BEGIN: Floating Support Widget -->
  <aside class="fixed bottom-6 right-6 z-40" data-purpose="chat-bot-widget">
    <button aria-label="Ask SofiAgent"
      class="flex items-center gap-2 bg-[#063327] hover:bg-[#03231a] text-white text-xs font-medium py-2.5 px-4 rounded-full shadow-lg transition-transform transform active:scale-95"
      type="button">
      <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
          stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span class="">Ask Swift Agent</span>
    </button>
  </aside>
  <!-- END: Floating Support Widget -->


</body>

</html>
