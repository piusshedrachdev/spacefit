<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in \u2014 SpaceFit</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-high": "#eae8e5", "surface-bright": "#fbf9f6", "surface-container-lowest": "#ffffff", "on-error": "#ffffff", "primary": "#914720", "on-primary": "#ffffff", "surface-variant": "#e4e2df", "on-surface-variant": "#54433c", "background": "#fbf9f6", "error": "#ba1a1a", "on-background": "#1b1c1a", "error-container": "#ffdad6", "outline-variant": "#dac1b7", "secondary": "#904d00", "on-surface": "#1b1c1a", "outline": "#87736a", "surface-container-low": "#f5f3f0", "secondary-container": "#fe932c", "on-secondary-container": "#663500", "surface-container": "#efeeeb", "surface": "#fbf9f6", "inverse-surface": "#30312f", "inverse-on-surface": "#f2f0ed" }, "spacing": { "space-lg": "1.5rem", "space-xs": "0.25rem", "space-md": "1rem", "space-xl": "2.5rem", "space-sm": "0.5rem" }, "fontFamily": { "headline-lg": ["Playfair Display"], "body-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-md": ["Playfair Display"] }, "fontSize": { "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }] } } } };</script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col">
  <header class="w-full bg-surface-bright shadow-[0_1px_8px_rgba(41,37,36,0.05)]">
    <div class="h-20 w-full max-w-[1360px] mx-auto px-margin flex items-center justify-between">
      <a class="flex items-center gap-space-sm" href="index.html"><img alt="SpaceFit" class="h-8 w-auto object-contain" src="logo.jpeg" /><span class="font-headline-md text-headline-md text-primary tracking-tight">SpaceFit</span></a>
      <a class="text-label-lg text-on-surface-variant hover:text-primary" href="index.html">Back to store</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-margin py-space-xl">
    <div class="w-full max-w-md">
      <div class="bg-surface-container-lowest rounded-2xl shadow-xl border border-outline-variant/40 overflow-hidden">
        <div class="bg-primary px-space-lg py-space-md">
          <h1 class="font-headline-md text-on-primary" id="authTitle">Welcome back</h1>
          <p class="font-body-sm text-primary-fixed-dim" id="authSubtitle">Sign in to continue to SpaceFit.</p>
        </div>

        <div class="grid grid-cols-2 border-b border-outline-variant/40" id="authTabs">
          <button type="button" data-tab="signin" class="py-space-md font-label-lg border-b-2 border-primary text-primary">Sign in</button>
          <button type="button" data-tab="signup" class="py-space-md font-label-lg border-b-2 border-transparent text-on-surface-variant hover:text-on-surface">Create account</button>
        </div>

        <form class="p-space-lg space-y-space-md" id="authForm" novalidate>
          <div id="signupFields" class="hidden space-y-space-md">
            <div>
              <label class="font-label-md text-on-surface-variant" for="fullName">Full name</label>
              <input class="w-full mt-space-xs px-space-md py-space-sm rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary" id="fullName" name="fullName" type="text" autocomplete="name" />
            </div>
            <div>
              <label class="font-label-md text-on-surface-variant" for="phone">Phone</label>
              <input class="w-full mt-space-xs px-space-md py-space-sm rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+234..." />
            </div>
          </div>

          <div>
            <label class="font-label-md text-on-surface-variant" for="email">Email</label>
            <input class="w-full mt-space-xs px-space-md py-space-sm rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary" id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div>
            <label class="font-label-md text-on-surface-variant" for="password">Password</label>
            <input class="w-full mt-space-xs px-space-md py-space-sm rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary" id="password" name="password" type="password" autocomplete="current-password" minlength="8" required />
            <p class="font-body-sm text-on-surface-variant mt-space-xs">At least 8 characters.</p>
          </div>

          <p class="hidden font-body-sm text-error" id="authError"></p>
          <p class="hidden font-body-sm text-secondary" id="authNotice"></p>

          <button class="w-full bg-primary text-on-primary py-space-md rounded-lg font-label-lg hover:opacity-95 transition-opacity disabled:opacity-60" id="authSubmit" type="submit">Sign in</button>
        </form>

        <div class="px-space-lg pb-space-lg">
          <div class="border-t border-outline-variant/40 pt-space-md">
            <p class="font-label-md text-on-surface-variant mb-space-sm">Demo accounts (memory mode)</p>
            <div class="flex flex-wrap gap-space-sm" id="demoAccounts">
              <button type="button" data-dev="dev-user-admin" class="text-label-md px-space-sm py-space-xs rounded-full border border-outline-variant hover:border-primary">Admin</button>
              <button type="button" data-dev="dev-user-seller" class="text-label-md px-space-sm py-space-xs rounded-full border border-outline-variant hover:border-primary">Seller</button>
              <button type="button" data-dev="dev-user-customer" class="text-label-md px-space-sm py-space-xs rounded-full border border-outline-variant hover:border-primary">Customer</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
